services:
  mysql:
    image: mysql:8.0
    container_name: sisinv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sisinv-net

  api-gateway:
    build: ./api-gateway
    container_name: sisinv-gateway
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${GATEWAY_APP_KEY}"
      JWT_SECRET: "${JWT_SECRET}"
      MS_USUARIOS_URL: "http://ms-usuarios:8001"
      MS_PRODUCTOS_URL: "http://ms-productos:8002"
      MS_PROVEEDORES_URL: "http://ms-proveedores:8003"
      MS_INVENTARIO_URL: "http://ms-inventario:8004"
      MS_ORDENES_URL: "http://ms-ordenes:8005"
    depends_on:
      - ms-usuarios
      - ms-productos
      - ms-proveedores
      - ms-inventario
      - ms-ordenes
    networks:
      - sisinv-net

  ms-usuarios:
    build: ./ms-usuarios
    container_name: sisinv-usuarios
    ports:
      - "8001:8001"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${USUARIOS_APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: db_usuarios
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sisinv-net

  ms-productos:
    build: ./ms-productos
    container_name: sisinv-productos
    ports:
      - "8002:8002"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_productos
      DB_USER: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sisinv-net

  ms-proveedores:
    build: ./ms-proveedores
    container_name: sisinv-proveedores
    ports:
      - "8003:8003"
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    volumes:
      - proveedores_data:/app/data
    networks:
      - sisinv-net

  ms-inventario:
    build: ./ms-inventario
    container_name: sisinv-inventario
    ports:
      - "8004:8004"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${INVENTARIO_APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: db_inventario
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      ORDENES_INTERNAL_KEY: "${ORDENES_INTERNAL_KEY}"
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8004"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sisinv-net

  ms-ordenes:
    build: ./ms-ordenes
    container_name: sisinv-ordenes
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
      HOST: 0.0.0.0
      JWT_SECRET: "${JWT_SECRET}"
      MS_PRODUCTOS_URL: "http://ms-productos:8002"
      MS_PROVEEDORES_URL: "http://ms-proveedores:8003"
      MS_INVENTARIO_URL: "http://ms-inventario:8004"
      ORDENES_INTERNAL_KEY: "${ORDENES_INTERNAL_KEY}"
    volumes:
      - ordenes_data:/app/data
    depends_on:
      - ms-productos
      - ms-proveedores
      - ms-inventario
    networks:
      - sisinv-net

volumes:
  mysql_data:
  proveedores_data:
  ordenes_data:

networks:
  sisinv-net:
    driver: bridge